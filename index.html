  :root {
    --ink: #1a2240;
    --ink-soft: #4a5578;
    --mist: #f5f7fb;
    --cloud: #eef1f8;
    --teal: #0ea5b7;
    --teal-soft: #cbeef3;
    --indigo: #6366f1;
    --indigo-soft: #e0e4ff;
    --plum: #8b5cf6;
    --rose: #f4a8b9;
    --amber: #f7b955;
    --sage: #8ac8a4;
  }
  html, body { background: #fafbfd; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
  .ink { color: var(--ink); }
  .ink-soft { color: var(--ink-soft); }
  .bg-mist { background: var(--mist); }
  .bg-cloud { background: var(--cloud); }
  .bg-app-gradient {
    background:
      radial-gradient(1200px 600px at -10% -20%, #e0e7ff 0%, transparent 60%),
      radial-gradient(900px 500px at 110% -10%, #cbeef3 0%, transparent 55%),
      radial-gradient(800px 600px at 50% 110%, #ede9fe 0%, transparent 60%),
      #fafbfd;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 1px 2px rgba(26,34,64,0.04), 0 12px 40px -12px rgba(26,34,64,0.10);
    border: 1px solid rgba(26,34,64,0.05);
  }
  .card-soft {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    border: 1px solid rgba(26,34,64,0.06);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: var(--cloud); color: var(--ink-soft);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 14px;
    font-weight: 600; font-size: 15px;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1 0%, #0ea5b7 100%);
    color: white;
    box-shadow: 0 8px 24px -8px rgba(99,102,241,0.55);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(99,102,241,0.6); }
  .btn-ghost { background: rgba(26,34,64,0.04); color: var(--ink); }
  .btn-ghost:hover { background: rgba(26,34,64,0.08); }
  .btn-outline { border: 1px solid rgba(26,34,64,0.12); color: var(--ink); background: white; }
  .btn-outline:hover { background: var(--mist); }

  /* Slider */
  input[type="range"].cir {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 8px; border-radius: 999px;
    background: linear-gradient(90deg, #cbeef3 0%, #e0e4ff 50%, #ede9fe 100%);
    outline: none;
  }
  input[type="range"].cir::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: white; border: 3px solid #6366f1;
    box-shadow: 0 4px 12px rgba(99,102,241,0.35);
    cursor: pointer;
  }
  input[type="range"].cir::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: white; border: 3px solid #6366f1;
    box-shadow: 0 4px 12px rgba(99,102,241,0.35);
    cursor: pointer;
  }

  /* Sticky note */
  .sticky {
    position: relative;
    border-radius: 14px;
    padding: 14px 14px 12px;
    font-size: 14px; line-height: 1.4;
    box-shadow: 0 6px 18px -8px rgba(26,34,64,0.25);
    transition: transform .15s ease, box-shadow .2s ease;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .sticky:hover { transform: translateY(-2px) rotate(-0.2deg); }
  .sticky textarea {
    width: 100%; background: transparent; resize: none; outline: none;
    font: inherit; color: inherit; min-height: 56px;
  }
  .sticky-amber  { background: #fff4d6; }
  .sticky-rose   { background: #ffe0e6; }
  .sticky-sage   { background: #dff1e6; }
  .sticky-teal   { background: #d6f1f5; }
  .sticky-lilac  { background: #ece5ff; }

  /* Subtle scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8def0; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #c4cbe3; }

  /* Heatmap cell */
  .heat-cell { border-radius: 10px; aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center; font-weight: 600; font-size: 12px; color: white; }

  /* Word cloud chips */
  .cloud-chip { display:inline-flex; align-items:center; padding: 6px 12px; border-radius: 999px; margin: 4px; font-weight: 600; }

  /* Focus visible */
  button:focus-visible, [role="button"]:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid #a5b4fc; outline-offset: 2px; border-radius: 10px;
  }

  /* Hide number input spinners */
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* Animated underline for nav */
  .nav-link { position: relative; }
  .nav-link.active::after {
    content: ''; position: absolute; left: 8px; right: 8px; bottom: -6px;
    height: 3px; border-radius: 3px; background: linear-gradient(90deg, #6366f1, #0ea5b7);
  }

  .grain::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(26,34,64,0.04) 1px, transparent 1px);
    background-size: 18px 18px; opacity: .35;
    border-radius: inherit;
  }

</style>
